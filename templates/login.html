{% extends "base.html" %}
{% block title %}Login - ProFinder{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Login</h2>
    <form method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn-primary">Login</button>
    </form>
    <p>No account? <a href="{{ url_for('register') }}">Register here</a></p>
    <p style="font-size:0.85rem;color:#7f8c8d;margin-top:1rem;">
        <strong>Demo accounts (password: password123):</strong><br>
        Ritesh (customer) · Kriti (provider) · Admin (admin)
    </p>
</div>
{% endblock %}
