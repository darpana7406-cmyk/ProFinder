{% extends "base.html" %}
{% block title %}Register - ProFinder{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Create Account</h2>
    <form method="POST">
        <div class="form-row">
            <div class="form-group"><label>First Name</label><input type="text" name="first_name" required></div>
            <div class="form-group"><label>Last Name</label><input type="text" name="last_name" required></div>
        </div>
        <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
        <div class="form-group"><label>Phone</label><input type="text" name="phone" required></div>
        <div class="form-row">
            <div class="form-group"><label>Age</label><input type="number" name="age" min="18" max="100"></div>
            <div class="form-group"><label>City</label><input type="text" name="city" value="Pune"></div>
        </div>
        <div class="form-group"><label>Username</label><input type="text" name="username" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required minlength="6"></div>
        <div class="form-group">
            <label>Register As</label>
            <select name="role" required>
                <option value="customer">Customer</option>
                <option value="provider">Service Provider</option>
            </select>
        </div>
        <button type="submit" class="btn-primary">Register</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
