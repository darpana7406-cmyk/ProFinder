{% extends "base.html" %}
{% block title %}Book Service - ProFinder{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Book {{ service.ServiceName }}</h2>
    <p>Category: {{ service.CategoryName }}</p>
    <p class="price">Price: ₹{{ service.PricePerHour }}/hr</p>

    <form method="POST">
        <div class="form-group">
            <label>Date</label>
            <input type="date" name="date" required min="{{ today }}">
        </div>
        <div class="form-group">
            <label>Time</label>
            <input type="time" name="time" required>
        </div>
        <div class="form-group">
            <label><input type="checkbox" name="emergency"> Mark as Emergency</label>
        </div>
        <button type="submit" class="btn-primary">Confirm Booking</button>
    </form>
</div>
{% endblock %}
